# Seguros - seguros.wakecomex.com
# Frontend estatico em /var/www/seguros, API sob /api/ no container seguros-backend.
server {
    listen 127.0.0.1:80;
    server_name seguros.wakecomex.com;

    # o certbot injeta aqui o redirect para https ao emitir o certificado

    root /var/www/seguros;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # sem barra final no proxy_pass: o backend usa setGlobalPrefix('api'),
    # entao as rotas ja esperam o /api no path — nao remover o prefixo aqui.
    location /api/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;

        # anexos de processo (tarefa 31)
        client_max_body_size 20m;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    access_log /var/log/nginx/seguros.access.log;
    error_log  /var/log/nginx/seguros.error.log;
}
